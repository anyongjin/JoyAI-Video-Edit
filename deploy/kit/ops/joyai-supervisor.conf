[program:joyai-demo]
command=/bin/bash /root/autodl-tmp/JoyAI-Video-Edit/deploy/ops/serve.sh
directory=/root/autodl-tmp/JoyAI-Video-Edit
autostart=true
autorestart=true
startsecs=30
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/root/autodl-tmp/joyai-logs/demo.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
